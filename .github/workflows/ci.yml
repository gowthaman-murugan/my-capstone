name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codereview_bot_test
      NEXTAUTH_SECRET: test-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_APP_ID: '1'
      GITHUB_APP_PRIVATE_KEY: test-key
      GITHUB_APP_CLIENT_ID: test-client-id
      GITHUB_APP_CLIENT_SECRET: test-client-secret
      GITHUB_WEBHOOK_SECRET: test-webhook-secret
      ANTHROPIC_API_KEY: test-api-key

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codereview_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codereview_bot
      NEXTAUTH_SECRET: build-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_APP_ID: '1'
      GITHUB_APP_PRIVATE_KEY: build-key
      GITHUB_APP_CLIENT_ID: build-client-id
      GITHUB_APP_CLIENT_SECRET: build-client-secret
      GITHUB_WEBHOOK_SECRET: build-webhook-secret
      ANTHROPIC_API_KEY: build-api-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build production bundle
        run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities in dependencies
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30
